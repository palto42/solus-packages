# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yubikey-manager
version    : 6.0.0
release    : 49
source     :
    - https://github.com/Yubico/yubikey-manager/archive/refs/tags/6.0.0-beta.0.tar.gz : 114e854b0745b596cf308bc00a287b48a5ceff9c7e9daa81b8010e3f510ada45
homepage   : https://developers.yubico.com/yubikey-manager/
license    : BSD-2-Clause
component  : security
summary    : Command line tool for configuring a YubiKey.
description: |
    Command line tool for configuring a YubiKey.
networking : true
builddeps  :
    - pkgconfig(dbus-1)
    - pkgconfig(gudev-1.0)
    - pkgconfig(libpcsclite)
    - cargo-zigbuild
    - rust
    - zig
rundeps    :
    - ccid
    - pcsc-lite
environment: |
    export TARGET="x86_64-unknown-linux-gnu"
    export GLIBC=2.34
build      : |
    cargo zigbuild --locked --release --target "$TARGET.$GLIBC" -p ykman-cli

    target/$TARGET/release/ykman --version
    
    # Seem version 6 doesn't support generating shell completions
    # # Create shell completions
    # _YKMAN_COMPLETE=bash_source target/$TARGET/release/ykman > ykman.bash
    # _YKMAN_COMPLETE=zsh_source target/$TARGET/release/ykman > _ykman
install    : |
    install -Dm00755 target/$TARGET/release/ykman /home/build/YPKG/root/yubikey-manager/install/usr/bin/ykman

    # Preset to enable pcscd.socket
    install -Dm00644 -t ${installdir}/%libdir%/systemd/service-preset/ ${pkgfiles}/20-yubikey-manager.preset

    # Manpages
    install -Dm00644 man/ykman.1 -t "$installdir/usr/share/man/man1/"

    # # Install completions
    # install -Dm0644 ykman.bash -t "$installdir/usr/share/bash-completion/completions/"
    # install -Dm0644 _ykman -t "$installdir/usr/share/zsh/site-functions/"

    # Include copyright notice as required by the license
    %install_license LICENSE
